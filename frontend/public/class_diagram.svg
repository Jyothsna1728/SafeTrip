<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 1340" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <!-- Inheritance Hollow Triangle Marker -->
    <marker id="inheritance" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <polygon points="0,0 13,7 0,14" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    </marker>
    <!-- Open Association / Dependency Arrow Marker -->
    <marker id="openArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#000000" stroke-width="1.6"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="810" y="38" fill="#000000" font-size="24" font-weight="bold" text-anchor="middle">SafeTrip — UML Class Diagram</text>
  <line x1="40" y1="52" x2="1580" y2="52" stroke="#000000" stroke-width="1.5"/>

  <!-- ================= LEVEL 1 (TOP CENTER): USER CLASS ================= -->
  <g transform="translate(635, 75)">
    <rect width="350" height="235" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="175" y="24" fill="#000000" font-size="15" font-weight="bold" text-anchor="middle">User</text>
    <line x1="0" y1="34" x2="350" y2="34" stroke="#000000" stroke-width="1.2"/>
    
    <text x="14" y="52" fill="#000000" font-size="12">- userId : Long</text>
    <text x="14" y="70" fill="#000000" font-size="12">- name : String</text>
    <text x="14" y="88" fill="#000000" font-size="12">- email : String</text>
    <text x="14" y="106" fill="#000000" font-size="12">- password : String</text>
    <text x="14" y="124" fill="#000000" font-size="12">- phone : String</text>
    <text x="14" y="142" fill="#000000" font-size="12">- emergencyContactName : String</text>
    <text x="14" y="160" fill="#000000" font-size="12">- emergencyContactPhone : String</text>
    
    <line x1="0" y1="170" x2="350" y2="170" stroke="#000000" stroke-width="1.2"/>
    
    <text x="14" y="188" fill="#000000" font-size="12">+ register(req : RegisterRequest) : boolean</text>
    <text x="14" y="206" fill="#000000" font-size="12">+ login(req : AuthRequest) : String</text>
    <text x="14" y="224" fill="#000000" font-size="12">+ updateProfile(req : UpdateProfileRequest) : void</text>
  </g>

  <!-- ================= INHERITANCE: Traveler IS-A User ================= -->
  <line x1="810" y1="375" x2="810" y2="310" stroke="#000000" stroke-width="2" marker-end="url(#inheritance)"/>

  <!-- ================= LEVEL 2 (MIDDLE ROW): TRAVELER & SIBLING MODULES ================= -->

  <!-- Left: SafetyHub & Emergency Mode -->
  <g transform="translate(80, 375)">
    <rect width="360" height="235" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="180" y="24" fill="#000000" font-size="15" font-weight="bold" text-anchor="middle">SafetyHub &amp; Emergency Mode</text>
    <line x1="0" y1="34" x2="360" y2="34" stroke="#000000" stroke-width="1.2"/>
    
    <text x="14" y="54" fill="#000000" font-size="12">- isEmergencyModeActive : Boolean</text>
    <text x="14" y="74" fill="#000000" font-size="12">- emergencyHelplines : String</text>
    <text x="14" y="94" fill="#000000" font-size="12">- isContactConfigured : Boolean</text>
    
    <line x1="0" y1="108" x2="360" y2="108" stroke="#000000" stroke-width="1.2"/>
    
    <text x="14" y="128" fill="#000000" font-size="12">+ recordCheckIn(loc, lat, lon) : void</text>
    <text x="14" y="148" fill="#000000" font-size="12">+ openEmergencyAccess() : void</text>
    <text x="14" y="168" fill="#000000" font-size="12">+ getHelplines() : List&lt;String&gt;</text>
    <text x="14" y="188" fill="#000000" font-size="12">+ locateNearbyHospitals() : void</text>
    <text x="14" y="208" fill="#000000" font-size="12">+ updateEmergencyContact() : void</text>
  </g>

  <!-- Center: Traveler (Subclass of User) -->
  <g transform="translate(635, 375)">
    <rect width="350" height="200" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="175" y="24" fill="#000000" font-size="15" font-weight="bold" text-anchor="middle">Traveler</text>
    <line x1="0" y1="34" x2="350" y2="34" stroke="#000000" stroke-width="1.2"/>
    
    <text x="14" y="54" fill="#000000" font-size="12">- currentTripId : Long</text>
    <text x="14" y="74" fill="#000000" font-size="12">- totalSavedPlaces : Integer</text>
    
    <line x1="0" y1="88" x2="350" y2="88" stroke="#000000" stroke-width="1.2"/>
    
    <text x="14" y="108" fill="#000000" font-size="12">+ createTrip(trip : Trip) : Long</text>
    <text x="14" y="128" fill="#000000" font-size="12">+ addPlace(place : TripPlace) : void</text>
    <text x="14" y="148" fill="#000000" font-size="12">+ savePlace(p : SavedPlace) : void</text>
    <text x="14" y="168" fill="#000000" font-size="12">+ viewTrips() : List&lt;Trip&gt;</text>
  </g>

  <!-- Right: AITravelAssistant -->
  <g transform="translate(1180, 375)">
    <rect width="360" height="200" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="180" y="24" fill="#000000" font-size="15" font-weight="bold" text-anchor="middle">AITravelAssistant</text>
    <line x1="0" y1="34" x2="360" y2="34" stroke="#000000" stroke-width="1.2"/>
    
    <text x="14" y="54" fill="#000000" font-size="12">- groqModel : String</text>
    <text x="14" y="74" fill="#000000" font-size="12">- groqApiKey : String</text>
    
    <line x1="0" y1="88" x2="360" y2="88" stroke="#000000" stroke-width="1.2"/>
    
    <text x="14" y="108" fill="#000000" font-size="12">+ getTripAdvice(prompt) : String</text>
    <text x="14" y="128" fill="#000000" font-size="12">+ getSafetyGuidance(city) : String</text>
    <text x="14" y="148" fill="#000000" font-size="12">+ recommendPlaces(cat) : List</text>
    <text x="14" y="168" fill="#000000" font-size="12">+ planItinerary(days, dest) : String</text>
  </g>

  <!-- ================= LEVEL 3 (LOWER ROW): DATA & ENTITY CLASSES ================= -->

  <!-- Left: SafetyCheckin -->
  <g transform="translate(80, 710)">
    <rect width="360" height="225" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="180" y="24" fill="#000000" font-size="15" font-weight="bold" text-anchor="middle">SafetyCheckin</text>
    <line x1="0" y1="34" x2="360" y2="34" stroke="#000000" stroke-width="1.2"/>
    
    <text x="14" y="54" fill="#000000" font-size="12">- checkinId : Long</text>
    <text x="14" y="72" fill="#000000" font-size="12">- locationName : String</text>
    <text x="14" y="90" fill="#000000" font-size="12">- latitude : Double</text>
    <text x="14" y="108" fill="#000000" font-size="12">- longitude : Double</text>
    <text x="14" y="126" fill="#000000" font-size="12">- status : String (&quot;SAFE&quot;)</text>
    <text x="14" y="144" fill="#000000" font-size="12">- checkedAt : Date</text>
    
    <line x1="0" y1="154" x2="360" y2="154" stroke="#000000" stroke-width="1.2"/>
    
    <text x="14" y="174" fill="#000000" font-size="12">+ recordCheckIn() : void</text>
    <text x="14" y="192" fill="#000000" font-size="12">+ getCoordinates() : String</text>
    <text x="14" y="210" fill="#000000" font-size="12">+ getCheckedTime() : Date</text>
  </g>

  <!-- Center-Left: Trip -->
  <g transform="translate(490, 710)">
    <rect width="310" height="225" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="155" y="24" fill="#000000" font-size="15" font-weight="bold" text-anchor="middle">Trip</text>
    <line x1="0" y1="34" x2="310" y2="34" stroke="#000000" stroke-width="1.2"/>
    
    <text x="14" y="54" fill="#000000" font-size="12">- tripId : Long</text>
    <text x="14" y="72" fill="#000000" font-size="12">- destination : String</text>
    <text x="14" y="90" fill="#000000" font-size="12">- startDate : Date</text>
    <text x="14" y="108" fill="#000000" font-size="12">- endDate : Date</text>
    <text x="14" y="126" fill="#000000" font-size="12">- notes : String</text>
    <text x="14" y="144" fill="#000000" font-size="12">- createdAt : Date</text>
    
    <line x1="0" y1="154" x2="310" y2="154" stroke="#000000" stroke-width="1.2"/>
    
    <text x="14" y="174" fill="#000000" font-size="12">+ addPlace(p : TripPlace)</text>
    <text x="14" y="192" fill="#000000" font-size="12">+ removePlace(id : Long)</text>
    <text x="14" y="210" fill="#000000" font-size="12">+ getPlaces() : List</text>
  </g>

  <!-- Center-Right: SavedPlace -->
  <g transform="translate(840, 710)">
    <rect width="300" height="225" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="150" y="24" fill="#000000" font-size="15" font-weight="bold" text-anchor="middle">SavedPlace</text>
    <line x1="0" y1="34" x2="300" y2="34" stroke="#000000" stroke-width="1.2"/>
    
    <text x="14" y="54" fill="#000000" font-size="12">- placeId : Long</text>
    <text x="14" y="72" fill="#000000" font-size="12">- externalPlaceId : String</text>
    <text x="14" y="90" fill="#000000" font-size="12">- placeName : String</text>
    <text x="14" y="108" fill="#000000" font-size="12">- category : String</text>
    <text x="14" y="126" fill="#000000" font-size="12">- latitude : Double</text>
    <text x="14" y="144" fill="#000000" font-size="12">- longitude : Double</text>
    
    <line x1="0" y1="154" x2="300" y2="154" stroke="#000000" stroke-width="1.2"/>
    
    <text x="14" y="174" fill="#000000" font-size="12">+ savePlace() : void</text>
    <text x="14" y="192" fill="#000000" font-size="12">+ deleteSavedPlace() : void</text>
    <text x="14" y="210" fill="#000000" font-size="12">+ getDetails() : PlaceDto</text>
  </g>

  <!-- ================= LEVEL 4 (LOWER/RIGHT BACKEND SERVICES) ================= -->

  <!-- Bottom Left: SafetyService (Placed cleanly below SafetyCheckin) -->
  <g transform="translate(80, 1030)">
    <rect width="360" height="215" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="180" y="24" fill="#000000" font-size="15" font-weight="bold" text-anchor="middle">SafetyService</text>
    <line x1="0" y1="34" x2="360" y2="34" stroke="#000000" stroke-width="1.2"/>
    
    <text x="14" y="54" fill="#000000" font-size="12">- checkinRepository : Object</text>
    <text x="14" y="74" fill="#000000" font-size="12">- userRepository : Object</text>
    
    <line x1="0" y1="88" x2="360" y2="88" stroke="#000000" stroke-width="1.2"/>
    
    <text x="14" y="108" fill="#000000" font-size="12">+ createCheckin(req) : Map</text>
    <text x="14" y="128" fill="#000000" font-size="12">+ getUserCheckins() : List</text>
    <text x="14" y="148" fill="#000000" font-size="12">+ getEmergencyHelplines() : List</text>
    <text x="14" y="168" fill="#000000" font-size="12">+ updateEmergencyContact() : User</text>
    <text x="14" y="188" fill="#000000" font-size="12">+ getEmergencyContacts() : Map</text>
  </g>

  <!-- Bottom Right: PlacesService -->
  <g transform="translate(1180, 710)">
    <rect width="360" height="225" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="180" y="24" fill="#000000" font-size="15" font-weight="bold" text-anchor="middle">PlacesService</text>
    <line x1="0" y1="34" x2="360" y2="34" stroke="#000000" stroke-width="1.2"/>
    
    <text x="14" y="54" fill="#000000" font-size="12">- geopyApiKey : String</text>
    <text x="14" y="74" fill="#000000" font-size="12">- defaultRadius : Integer</text>
    <text x="14" y="94" fill="#000000" font-size="12">- searchLimit : Integer</text>
    
    <line x1="0" y1="108" x2="360" y2="108" stroke="#000000" stroke-width="1.2"/>
    
    <text x="14" y="128" fill="#000000" font-size="12">+ getNearbyPlaces(lat, lon) : List</text>
    <text x="14" y="148" fill="#000000" font-size="12">+ searchDestinations(query) : List</text>
    <text x="14" y="168" fill="#000000" font-size="12">+ reverseGeocode(lat, lon) : GeoCodeDto</text>
    <text x="14" y="188" fill="#000000" font-size="12">+ getPlaceDetails(placeId) : PlaceDto</text>
    <text x="14" y="208" fill="#000000" font-size="12">+ searchHospitals(lat, lon) : List</text>
  </g>

  <!-- ================= ASSOCIATIONS & RELATIONSHIP LINES ================= -->

  <!-- Relationship: Traveler 1 ──── 1..* Trip (plans) -->
  <line x1="710" y1="575" x2="645" y2="710" stroke="#000000" stroke-width="1.8"/>
  <text x="720" y="595" fill="#000000" font-size="12" font-weight="bold">1</text>
  <text x="675" y="640" fill="#000000" font-size="12" font-weight="bold">plans</text>
  <text x="655" y="700" fill="#000000" font-size="12" font-weight="bold">1..*</text>

  <!-- Relationship: Traveler 1 ──── * SavedPlace (bookmarks) -->
  <line x1="910" y1="575" x2="960" y2="710" stroke="#000000" stroke-width="1.8"/>
  <text x="895" y="595" fill="#000000" font-size="12" font-weight="bold">1</text>
  <text x="945" y="640" fill="#000000" font-size="12" font-weight="bold">bookmarks</text>
  <text x="970" y="700" fill="#000000" font-size="12" font-weight="bold">*</text>

  <!-- Relationship: Traveler 1 ──── 1 SafetyHub & Emergency Mode (accesses) -->
  <line x1="635" y1="450" x2="440" y2="450" stroke="#000000" stroke-width="1.8"/>
  <text x="615" y="442" fill="#000000" font-size="12" font-weight="bold">1</text>
  <text x="535" y="442" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">accesses</text>
  <text x="450" y="442" fill="#000000" font-size="12" font-weight="bold">1</text>

  <!-- Relationship: Traveler 1 ──── 1 AITravelAssistant (consults) -->
  <line x1="985" y1="450" x2="1180" y2="450" stroke="#000000" stroke-width="1.8"/>
  <text x="995" y="442" fill="#000000" font-size="12" font-weight="bold">1</text>
  <text x="1080" y="442" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">consults</text>
  <text x="1160" y="442" fill="#000000" font-size="12" font-weight="bold">1</text>

  <!-- Relationship: SafetyHub 1 ──── * SafetyCheckin (logs) -->
  <line x1="260" y1="610" x2="260" y2="710" stroke="#000000" stroke-width="1.8"/>
  <text x="270" y="630" fill="#000000" font-size="12" font-weight="bold">1</text>
  <text x="270" y="660" fill="#000000" font-size="12" font-weight="bold">logs</text>
  <text x="270" y="700" fill="#000000" font-size="12" font-weight="bold">*</text>

  <!-- Relationship: SafetyHub ────> SafetyService (invokes) - CLEANLY ROUTED ON FAR-LEFT MARGIN -->
  <path d="M 80 490 L 30 490 L 30 1135 L 80 1135" fill="none" stroke="#000000" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#openArrow)"/>
  <text x="38" y="810" fill="#000000" font-size="12" font-weight="bold">invokes</text>

  <!-- Relationship: AITravelAssistant ────> PlacesService (queries) -->
  <line x1="1360" y1="575" x2="1360" y2="710" stroke="#000000" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#openArrow)"/>
  <text x="1370" y="645" fill="#000000" font-size="12" font-weight="bold">queries</text>

  <!-- Relationship: Trip 1 ──── * SavedPlace (contains) -->
  <line x1="800" y1="820" x2="840" y2="820" stroke="#000000" stroke-width="1.8"/>
  <text x="805" y="812" fill="#000000" font-size="12" font-weight="bold">1</text>
  <text x="820" y="840" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">contains</text>
  <text x="832" y="812" fill="#000000" font-size="12" font-weight="bold">*</text>

</svg>
