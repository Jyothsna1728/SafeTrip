<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 940" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <!-- Title -->
  <text x="640" y="38" fill="#000000" font-size="24" font-weight="bold" text-anchor="middle">SafeTrip — UML Deployment Diagram</text>
  <line x1="40" y1="52" x2="1240" y2="52" stroke="#000000" stroke-width="1.5"/>

  <!-- ================= 1. CLIENT NODE (TOP-LEFT) ================= -->
  <g transform="translate(60, 90)">
    <!-- 3D Node Cube Top -->
    <polygon points="0,15 15,0 335,0 320,15" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <!-- 3D Node Cube Right Side -->
    <polygon points="320,15 335,0 335,285 320,300" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <!-- 3D Node Front Face -->
    <rect x="0" y="15" width="320" height="285" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    
    <text x="160" y="42" fill="#000000" font-size="12" font-style="italic" text-anchor="middle">«device»</text>
    <text x="160" y="62" fill="#000000" font-size="15" font-weight="bold" text-anchor="middle">Client Device</text>
    <text x="160" y="80" fill="#000000" font-size="12" text-anchor="middle">(Web Browser: Chrome / Edge)</text>
    <line x1="0" y1="90" x2="320" y2="90" stroke="#000000" stroke-width="1.2"/>

    <!-- Execution Environment inside Client Node -->
    <g transform="translate(20, 105)">
      <rect width="280" height="175" fill="#ffffff" stroke="#000000" stroke-width="1.4" stroke-dasharray="3,3"/>
      <text x="140" y="24" fill="#000000" font-size="11" font-style="italic" text-anchor="middle">«execution environment»</text>
      <text x="140" y="42" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Browser JavaScript Engine</text>
      <line x1="0" y1="52" x2="280" y2="52" stroke="#000000" stroke-width="1"/>

      <!-- Artifact 1: React Single Page Application -->
      <g transform="translate(15, 65)">
        <rect width="250" height="95" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
        <text x="125" y="20" fill="#000000" font-size="11" font-style="italic" text-anchor="middle">«artifact»</text>
        <text x="125" y="38" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">SafeTrip Frontend Bundle</text>
        <text x="12" y="60" fill="#000000" font-size="11">• React.js &amp; TailwindCSS</text>
        <text x="12" y="78" fill="#000000" font-size="11">• Leaflet Map Engine &amp; Axios</text>
      </g>
    </g>
  </g>

  <!-- ================= 2. APPLICATION SERVER NODE (TOP-RIGHT) ================= -->
  <g transform="translate(560, 90)">
    <!-- 3D Node Cube Top -->
    <polygon points="0,15 15,0 355,0 340,15" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <!-- 3D Node Cube Right Side -->
    <polygon points="340,15 355,0 355,285 340,300" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <!-- 3D Node Front Face -->
    <rect x="0" y="15" width="340" height="285" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>

    <text x="170" y="42" fill="#000000" font-size="12" font-style="italic" text-anchor="middle">«device»</text>
    <text x="170" y="62" fill="#000000" font-size="15" font-weight="bold" text-anchor="middle">Application Server</text>
    <text x="170" y="80" fill="#000000" font-size="12" text-anchor="middle">(Linux / Windows OS)</text>
    <line x1="0" y1="90" x2="340" y2="90" stroke="#000000" stroke-width="1.2"/>

    <!-- Execution Environment: Spring Boot / JVM -->
    <g transform="translate(20, 105)">
      <rect width="300" height="175" fill="#ffffff" stroke="#000000" stroke-width="1.4" stroke-dasharray="3,3"/>
      <text x="150" y="24" fill="#000000" font-size="11" font-style="italic" text-anchor="middle">«execution environment»</text>
      <text x="150" y="42" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Java 17 Runtime (Tomcat)</text>
      <line x1="0" y1="52" x2="300" y2="52" stroke="#000000" stroke-width="1"/>

      <!-- Artifact 2: Spring Boot Backend JAR -->
      <g transform="translate(15, 65)">
        <rect width="270" height="95" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
        <text x="135" y="20" fill="#000000" font-size="11" font-style="italic" text-anchor="middle">«artifact»</text>
        <text x="135" y="38" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">safetrip-backend.jar</text>
        <text x="12" y="60" fill="#000000" font-size="11">• Spring Boot REST Controllers</text>
        <text x="12" y="78" fill="#000000" font-size="11">• Spring Security &amp; JWT Engine</text>
      </g>
    </g>
  </g>

  <!-- ================= 3. DATABASE SERVER NODE (BOTTOM-LEFT) ================= -->
  <g transform="translate(60, 520)">
    <!-- 3D Node Cube Top -->
    <polygon points="0,15 15,0 335,0 320,15" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <!-- 3D Node Cube Right Side -->
    <polygon points="320,15 335,0 335,285 320,300" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <!-- 3D Node Front Face -->
    <rect x="0" y="15" width="320" height="285" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>

    <text x="160" y="42" fill="#000000" font-size="12" font-style="italic" text-anchor="middle">«device»</text>
    <text x="160" y="62" fill="#000000" font-size="15" font-weight="bold" text-anchor="middle">Database Server</text>
    <text x="160" y="80" fill="#000000" font-size="12" text-anchor="middle">(MySQL DBMS Instance)</text>
    <line x1="0" y1="90" x2="320" y2="90" stroke="#000000" stroke-width="1.2"/>

    <!-- Execution Environment: MySQL 8 -->
    <g transform="translate(20, 105)">
      <rect width="280" height="175" fill="#ffffff" stroke="#000000" stroke-width="1.4" stroke-dasharray="3,3"/>
      <text x="140" y="24" fill="#000000" font-size="11" font-style="italic" text-anchor="middle">«database system»</text>
      <text x="140" y="42" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">MySQL 8.0 Engine</text>
      <line x1="0" y1="52" x2="280" y2="52" stroke="#000000" stroke-width="1"/>

      <!-- Artifact 3: SafeTrip Database Schema -->
      <g transform="translate(15, 65)">
        <rect width="250" height="95" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
        <text x="125" y="20" fill="#000000" font-size="11" font-style="italic" text-anchor="middle">«artifact»</text>
        <text x="125" y="38" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">safe_trip Database Schema</text>
        <text x="12" y="60" fill="#000000" font-size="11">• users, trips, trip_places</text>
        <text x="12" y="78" fill="#000000" font-size="11">• saved_places, safety_checkins</text>
      </g>
    </g>
  </g>

  <!-- ================= 4. EXTERNAL CLOUD SERVICES (BOTTOM-RIGHT) ================= -->
  <g transform="translate(560, 520)">
    <!-- 3D Node Cube Top -->
    <polygon points="0,15 15,0 355,0 340,15" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <!-- 3D Node Cube Right Side -->
    <polygon points="340,15 355,0 355,285 340,300" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <!-- 3D Node Front Face -->
    <rect x="0" y="15" width="340" height="285" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>

    <text x="170" y="42" fill="#000000" font-size="12" font-style="italic" text-anchor="middle">«cloud»</text>
    <text x="170" y="62" fill="#000000" font-size="15" font-weight="bold" text-anchor="middle">External Cloud APIs</text>
    <text x="170" y="80" fill="#000000" font-size="12" text-anchor="middle">(Third-Party Providers)</text>
    <line x1="0" y1="90" x2="340" y2="90" stroke="#000000" stroke-width="1.2"/>

    <!-- Artifact 4: Geoapify Places API -->
    <g transform="translate(20, 105)">
      <rect width="300" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
      <text x="150" y="22" fill="#000000" font-size="11" font-style="italic" text-anchor="middle">«external service»</text>
      <text x="150" y="38" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Geoapify Places &amp; Geocoding API</text>
    </g>

    <!-- Artifact 5: Groq AI API -->
    <g transform="translate(20, 165)">
      <rect width="300" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
      <text x="150" y="22" fill="#000000" font-size="11" font-style="italic" text-anchor="middle">«external service»</text>
      <text x="150" y="38" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Groq AI API (OpenAI-Compatible LLM)</text>
    </g>

    <!-- Artifact 6: SMTP Mail Server -->
    <g transform="translate(20, 225)">
      <rect width="300" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
      <text x="150" y="22" fill="#000000" font-size="11" font-style="italic" text-anchor="middle">«external service»</text>
      <text x="150" y="38" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">SMTP Mail Service (Gmail / TLS)</text>
    </g>
  </g>

  <!-- ================= COMMUNICATION PROTOCOL PATHS ================= -->

  <!-- Protocol 1: Client Node to Application Server (HTTPS / REST) -->
  <line x1="380" y1="240" x2="560" y2="240" stroke="#000000" stroke-width="2"/>
  <g transform="translate(400, 205)">
    <rect width="140" height="32" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <text x="70" y="20" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">HTTPS / REST (JSON)</text>
  </g>

  <!-- Protocol 2: Application Server to Database Server (JDBC / TCP) -->
  <line x1="730" y1="390" x2="730" y2="450" stroke="#000000" stroke-width="2"/>
  <line x1="730" y1="450" x2="220" y2="450" stroke="#000000" stroke-width="2"/>
  <line x1="220" y1="450" x2="220" y2="520" stroke="#000000" stroke-width="2"/>
  <g transform="translate(380, 430)">
    <rect width="180" height="32" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <text x="90" y="20" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">JDBC / TCP (Port 3306)</text>
  </g>

  <!-- Protocol 3: Application Server to Cloud APIs (HTTPS / TLS) -->
  <line x1="800" y1="390" x2="800" y2="520" stroke="#000000" stroke-width="2"/>
  <g transform="translate(810, 430)">
    <rect width="160" height="32" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <text x="80" y="20" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">HTTPS (REST &amp; SMTP)</text>
  </g>

</svg>
