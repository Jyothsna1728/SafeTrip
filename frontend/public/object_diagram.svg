<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 920" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <!-- Title -->
  <text x="640" y="36" fill="#000000" font-size="24" font-weight="bold" text-anchor="middle">SafeTrip — Complete UML Object Diagram</text>
  <line x1="40" y1="50" x2="1240" y2="50" stroke="#000000" stroke-width="1.5"/>

  <!-- ================= TIER 1: USER INSTANCE ================= -->
  <g transform="translate(480, 75)">
    <rect width="320" height="175" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="160" y="26" fill="#000000" font-size="14" font-weight="bold" text-decoration="underline" text-anchor="middle">user1 : User</text>
    <line x1="0" y1="36" x2="320" y2="36" stroke="#000000" stroke-width="1.2"/>
    <text x="14" y="58" fill="#000000" font-size="12">userId = 101</text>
    <text x="14" y="78" fill="#000000" font-size="12">name = &quot;Alex Johnson&quot;</text>
    <text x="14" y="98" fill="#000000" font-size="12">email = &quot;alex@safetrip.com&quot;</text>
    <text x="14" y="118" fill="#000000" font-size="12">phone = &quot;+1-555-0199&quot;</text>
    <text x="14" y="138" fill="#000000" font-size="12">emergencyContactName = &quot;Sarah Johnson&quot;</text>
    <text x="14" y="158" fill="#000000" font-size="12">emergencyContactPhone = &quot;+1-555-0188&quot;</text>
  </g>

  <!-- ================= TIER 2: 4 CORE FUNCTIONAL INSTANCES ================= -->

  <!-- 1. trip1 : Trip -->
  <g transform="translate(50, 320)">
    <rect width="270" height="150" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <text x="135" y="26" fill="#000000" font-size="14" font-weight="bold" text-decoration="underline" text-anchor="middle">trip1 : Trip</text>
    <line x1="0" y1="36" x2="270" y2="36" stroke="#000000" stroke-width="1.2"/>
    <text x="14" y="58" fill="#000000" font-size="12">tripId = 201</text>
    <text x="14" y="78" fill="#000000" font-size="12">destination = &quot;Paris, France&quot;</text>
    <text x="14" y="98" fill="#000000" font-size="12">startDate = 2026-09-10</text>
    <text x="14" y="118" fill="#000000" font-size="12">endDate = 2026-09-18</text>
    <text x="14" y="138" fill="#000000" font-size="12">notes = &quot;Autumn cultural trip&quot;</text>
  </g>

  <!-- 2. savedPlace1 : SavedPlace -->
  <g transform="translate(355, 320)">
    <rect width="270" height="150" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <text x="135" y="26" fill="#000000" font-size="14" font-weight="bold" text-decoration="underline" text-anchor="middle">savedPlace1 : SavedPlace</text>
    <line x1="0" y1="36" x2="270" y2="36" stroke="#000000" stroke-width="1.2"/>
    <text x="14" y="58" fill="#000000" font-size="12">placeId = 401</text>
    <text x="14" y="78" fill="#000000" font-size="12">placeName = &quot;Le Bistro Parisien&quot;</text>
    <text x="14" y="98" fill="#000000" font-size="12">category = &quot;catering.cafe&quot;</text>
    <text x="14" y="118" fill="#000000" font-size="12">latitude = 48.8588</text>
    <text x="14" y="138" fill="#000000" font-size="12">longitude = 2.2933</text>
  </g>

  <!-- 3. safetyFacility1 : SafetyFacility (Discovered in Safety Hub) -->
  <g transform="translate(655, 320)">
    <rect width="280" height="150" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <text x="140" y="26" fill="#000000" font-size="14" font-weight="bold" text-decoration="underline" text-anchor="middle">hospital1 : SafetyFacility</text>
    <line x1="0" y1="36" x2="280" y2="36" stroke="#000000" stroke-width="1.2"/>
    <text x="14" y="58" fill="#000000" font-size="12">facilityName = &quot;Necker Hospital&quot;</text>
    <text x="14" y="78" fill="#000000" font-size="12">type = &quot;HOSPITAL&quot;</text>
    <text x="14" y="98" fill="#000000" font-size="12">address = &quot;149 Rue de Sèvres, Paris&quot;</text>
    <text x="14" y="118" fill="#000000" font-size="12">distance = &quot;1.2 km away&quot;</text>
    <text x="14" y="138" fill="#000000" font-size="12">directions = &quot;Available on Map&quot;</text>
  </g>

  <!-- 4. assistantQuery1 : AiAssistantQuery -->
  <g transform="translate(965, 320)">
    <rect width="270" height="150" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <text x="135" y="26" fill="#000000" font-size="14" font-weight="bold" text-decoration="underline" text-anchor="middle">aiChat1 : AiAssistantQuery</text>
    <line x1="0" y1="36" x2="270" y2="36" stroke="#000000" stroke-width="1.2"/>
    <text x="14" y="58" fill="#000000" font-size="12">queryId = 601</text>
    <text x="14" y="78" fill="#000000" font-size="12">prompt = &quot;Safety tips for Paris metro&quot;</text>
    <text x="14" y="98" fill="#000000" font-size="12">model = &quot;Groq / OpenAI API&quot;</text>
    <text x="14" y="118" fill="#000000" font-size="12">response = &quot;Keep valuables secure...&quot;</text>
    <text x="14" y="138" fill="#000000" font-size="12">timestamp = 2026-09-10 14:15</text>
  </g>

  <!-- ================= TIER 3: SUB-INSTANCES (TRIP PLACES & POLICE STATION) ================= -->

  <!-- place1 : TripPlace -->
  <g transform="translate(50, 560)">
    <rect width="270" height="150" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <text x="135" y="26" fill="#000000" font-size="14" font-weight="bold" text-decoration="underline" text-anchor="middle">place1 : TripPlace</text>
    <line x1="0" y1="36" x2="270" y2="36" stroke="#000000" stroke-width="1.2"/>
    <text x="14" y="58" fill="#000000" font-size="12">id = 301</text>
    <text x="14" y="78" fill="#000000" font-size="12">placeName = &quot;Eiffel Tower&quot;</text>
    <text x="14" y="98" fill="#000000" font-size="12">category = &quot;tourism.sights&quot;</text>
    <text x="14" y="118" fill="#000000" font-size="12">latitude = 48.8584</text>
    <text x="14" y="138" fill="#000000" font-size="12">longitude = 2.2945</text>
  </g>

  <!-- place2 : TripPlace -->
  <g transform="translate(355, 560)">
    <rect width="270" height="150" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <text x="135" y="26" fill="#000000" font-size="14" font-weight="bold" text-decoration="underline" text-anchor="middle">place2 : TripPlace</text>
    <line x1="0" y1="36" x2="270" y2="36" stroke="#000000" stroke-width="1.2"/>
    <text x="14" y="58" fill="#000000" font-size="12">id = 302</text>
    <text x="14" y="78" fill="#000000" font-size="12">placeName = &quot;Louvre Museum&quot;</text>
    <text x="14" y="98" fill="#000000" font-size="12">category = &quot;entertainment.museum&quot;</text>
    <text x="14" y="118" fill="#000000" font-size="12">latitude = 48.8606</text>
    <text x="14" y="138" fill="#000000" font-size="12">longitude = 2.3376</text>
  </g>

  <!-- police1 : SafetyFacility -->
  <g transform="translate(655, 560)">
    <rect width="280" height="150" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <text x="140" y="26" fill="#000000" font-size="14" font-weight="bold" text-decoration="underline" text-anchor="middle">police1 : SafetyFacility</text>
    <line x1="0" y1="36" x2="280" y2="36" stroke="#000000" stroke-width="1.2"/>
    <text x="14" y="58" fill="#000000" font-size="12">facilityName = &quot;Commissariat Paris 7e&quot;</text>
    <text x="14" y="78" fill="#000000" font-size="12">type = &quot;POLICE_STATION&quot;</text>
    <text x="14" y="98" fill="#000000" font-size="12">address = &quot;9 Rue Fabert, Paris&quot;</text>
    <text x="14" y="118" fill="#000000" font-size="12">distance = &quot;0.8 km away&quot;</text>
    <text x="14" y="138" fill="#000000" font-size="12">directions = &quot;Available on Map&quot;</text>
  </g>

  <!-- ================= LINKS ================= -->
  <!-- user1 -> trip1 -->
  <line x1="520" y1="250" x2="185" y2="320" stroke="#000000" stroke-width="1.8"/>
  <text x="310" y="270" fill="#000000" font-size="11" font-weight="bold">plans</text>

  <!-- user1 -> savedPlace1 -->
  <line x1="580" y1="250" x2="490" y2="320" stroke="#000000" stroke-width="1.8"/>
  <text x="510" y="280" fill="#000000" font-size="11" font-weight="bold">bookmarks</text>

  <!-- user1 -> hospital1 -->
  <line x1="680" y1="250" x2="795" y2="320" stroke="#000000" stroke-width="1.8"/>
  <text x="750" y="280" fill="#000000" font-size="11" font-weight="bold">views safety</text>

  <!-- user1 -> aiChat1 -->
  <line x1="750" y1="250" x2="1100" y2="320" stroke="#000000" stroke-width="1.8"/>
  <text x="960" y="270" fill="#000000" font-size="11" font-weight="bold">interacts with</text>

  <!-- trip1 -> place1 -->
  <line x1="185" y1="470" x2="185" y2="560" stroke="#000000" stroke-width="1.8"/>
  <text x="195" y="515" fill="#000000" font-size="11" font-weight="bold">includes</text>

  <!-- trip1 -> place2 -->
  <line x1="250" y1="470" x2="420" y2="560" stroke="#000000" stroke-width="1.8"/>
  <text x="340" y="515" fill="#000000" font-size="11" font-weight="bold">includes</text>

  <!-- hospital1 -> police1 -->
  <line x1="795" y1="470" x2="795" y2="560" stroke="#000000" stroke-width="1.8"/>
  <text x="805" y="515" fill="#000000" font-size="11" font-weight="bold">discovers nearby</text>

</svg>
