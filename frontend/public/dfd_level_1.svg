<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1280" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="dfd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="780" y="38" fill="#000000" font-size="24" font-weight="bold" text-anchor="middle">SafeTrip — Level-1 Data Flow Diagram</text>
  <line x1="50" y1="52" x2="1510" y2="52" stroke="#000000" stroke-width="1.5"/>


  <!-- ========================================================================= -->
  <!-- 1. TOP SECTION: USER AUTHENTICATION & MANAGEMENT (1.0) -->
  <!-- ========================================================================= -->

  <!-- Top-Left: Traveler -->
  <g transform="translate(60, 95)">
    <rect width="180" height="70" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="90" y="40" fill="#000000" font-size="15" font-weight="bold" text-anchor="middle">Traveler</text>
  </g>

  <!-- Flow: Traveler to 1.0 (Top Line) -->
  <line x1="240" y1="115" x2="490" y2="115" stroke="#000000" stroke-width="1.5" marker-end="url(#dfd-arrow)"/>
  <g transform="translate(260, 95)">
    <rect width="210" height="18" fill="#ffffff"/>
    <text x="105" y="14" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">Registration / Login Info &#x2192;</text>
  </g>

  <!-- Flow: 1.0 to Traveler (Bottom Line) -->
  <line x1="490" y1="145" x2="240" y2="145" stroke="#000000" stroke-width="1.5" marker-end="url(#dfd-arrow)"/>
  <g transform="translate(260, 148)">
