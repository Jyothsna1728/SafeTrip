    <line x1="20" y1="46" x2="90" y2="46" stroke="#000000" stroke-width="1"/>
    <text x="55" y="62" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">User Auth &amp;</text>
    <text x="55" y="78" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">Management</text>
  </g>

  <!-- Flow: 1.0 to D1 User Database -->
