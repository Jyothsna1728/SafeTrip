    <text x="90" y="40" fill="#000000" font-size="15" font-weight="bold" text-anchor="middle">Traveler</text>
  </g>

  <!-- Flow: Traveler to 2.0 -->
  <line x1="240" y1="295" x2="490" y2="295" stroke="#000000" stroke-width="1.5" marker-end="url(#dfd-arrow)"/>
  <g transform="translate(260, 275)">
    <rect width="210" height="18" fill="#ffffff"/>
    <text x="105" y="14" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">Search Destination &#x2192;</text>
  </g>

  <!-- Flow: 2.0 to Traveler -->
  <line x1="490" y1="325" x2="240" y2="325" stroke="#000000" stroke-width="1.5" marker-end="url(#dfd-arrow)"/>
  <g transform="translate(260, 328)">
