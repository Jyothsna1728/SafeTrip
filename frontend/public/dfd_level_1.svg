    <circle cx="55" cy="55" r="55" fill="#ffffff" stroke="#000000" stroke-width="2.2"/>
    <text x="55" y="38" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">4.0</text>
    <line x1="20" y1="46" x2="90" y2="46" stroke="#000000" stroke-width="1"/>
    <text x="55" y="62" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">Safety Hub &amp;</text>
    <text x="55" y="78" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">Emergency Services</text>
  </g>

