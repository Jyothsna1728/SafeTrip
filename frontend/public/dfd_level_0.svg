<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="dfd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="40" fill="#000000" font-size="22" font-weight="bold" text-anchor="middle">SafeTrip — DFD Level 0 (Context Diagram)</text>
  <line x1="60" y1="55" x2="940" y2="55" stroke="#000000" stroke-width="1.5"/>

  <!-- ================= 1. EXTERNAL ENTITY (TOP): USER / TRAVELER ================= -->
  <g transform="translate(370, 85)">
    <rect width="260" height="60" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="130" y="36" fill="#000000" font-size="16" font-weight="bold" text-anchor="middle">User / Traveler</text>
  </g>

  <!-- ================= FLOWS: USER <-> SAFETRIP SYSTEM ================= -->

  <!-- Inflow (Down: Traveler to System) -->
  <line x1="440" y1="145" x2="440" y2="335" stroke="#000000" stroke-width="1.8" marker-end="url(#dfd-arrow)"/>
  <text x="425" y="225" fill="#000000" font-size="12" font-weight="bold" text-anchor="end">Login Details, Trip Data, Search Requests &#x2193;</text>

  <!-- Outflow (Up: System to Traveler) -->
  <line x1="560" y1="335" x2="560" y2="145" stroke="#000000" stroke-width="1.8" marker-end="url(#dfd-arrow)"/>
  <text x="575" y="225" fill="#000000" font-size="12" font-weight="bold" text-anchor="start">&#x2191; Auth Token, Saved Trips, Safety Cards</text>


  <!-- ================= 2. CENTRAL PROCESS: 0.0 SAFETRIP SYSTEM ================= -->
  <g transform="translate(360, 335)">
    <circle cx="140" cy="90" r="90" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
    <text x="140" y="60" fill="#000000" font-size="18" font-weight="bold" text-anchor="middle">0.0</text>
    <line x1="60" y1="72" x2="220" y2="72" stroke="#000000" stroke-width="1.4"/>
    <text x="140" y="102" fill="#000000" font-size="17" font-weight="bold" text-anchor="middle">SafeTrip</text>
    <text x="140" y="124" fill="#000000" font-size="17" font-weight="bold" text-anchor="middle">System</text>
  </g>


  <!-- ================= 3. FLOWS & BOTTOM EXTERNAL ENTITIES ================= -->

  <!-- ================= LEFT ENTITY: MAP & PLACES SERVICE ================= -->
  <!-- Downward Line to Map -->
  <line x1="390" y1="500" x2="200" y2="590" stroke="#000000" stroke-width="1.6"/>
  <line x1="200" y1="590" x2="200" y2="695" stroke="#000000" stroke-width="1.6" marker-end="url(#dfd-arrow)"/>
  <text x="185" y="640" fill="#000000" font-size="11" font-weight="bold" text-anchor="end">Search Query &#x2193;</text>

  <!-- Upward Line from Map -->
  <line x1="230" y1="695" x2="230" y2="580" stroke="#000000" stroke-width="1.6"/>
  <line x1="230" y1="580" x2="415" y2="495" stroke="#000000" stroke-width="1.6" marker-end="url(#dfd-arrow)"/>
  <text x="245" y="640" fill="#000000" font-size="11" font-weight="bold" text-anchor="start">&#x2191; Places &amp; POIs</text>

  <!-- Entity Box: Map & Places Service -->
  <g transform="translate(90, 695)">
    <rect width="240" height="60" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="120" y="35" fill="#000000" font-size="14" font-weight="bold" text-anchor="middle">Map &amp; Places Service</text>
  </g>


  <!-- ================= CENTER ENTITY: AI ASSISTANT SERVICE ================= -->
  <!-- Downward Line to AI -->
  <line x1="480" y1="515" x2="480" y2="695" stroke="#000000" stroke-width="1.6" marker-end="url(#dfd-arrow)"/>
  <text x="465" y="610" fill="#000000" font-size="11" font-weight="bold" text-anchor="end">Prompt &#x2193;</text>

  <!-- Upward Line from AI -->
  <line x1="520" y1="695" x2="520" y2="515" stroke="#000000" stroke-width="1.6" marker-end="url(#dfd-arrow)"/>
  <text x="535" y="610" fill="#000000" font-size="11" font-weight="bold" text-anchor="start">&#x2191; Tips &amp; Advice</text>

  <!-- Entity Box: AI Assistant Service -->
  <g transform="translate(380, 695)">
    <rect width="240" height="60" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="120" y="35" fill="#000000" font-size="14" font-weight="bold" text-anchor="middle">AI Assistant Service</text>
  </g>


  <!-- ================= RIGHT ENTITY: EMAIL SERVICE ================= -->
  <!-- Downward Line to Email -->
  <line x1="610" y1="500" x2="770" y2="580" stroke="#000000" stroke-width="1.6"/>
  <line x1="770" y1="580" x2="770" y2="695" stroke="#000000" stroke-width="1.6" marker-end="url(#dfd-arrow)"/>
  <text x="755" y="640" fill="#000000" font-size="11" font-weight="bold" text-anchor="end">Reset / OTP &#x2193;</text>

  <!-- Upward Line from Email -->
  <line x1="800" y1="695" x2="800" y2="590" stroke="#000000" stroke-width="1.6"/>
  <line x1="800" y1="590" x2="585" y2="495" stroke="#000000" stroke-width="1.6" marker-end="url(#dfd-arrow)"/>
  <text x="815" y="640" fill="#000000" font-size="11" font-weight="bold" text-anchor="start">&#x2191; Status</text>

  <!-- Entity Box: Email Service -->
  <g transform="translate(670, 695)">
    <rect width="240" height="60" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="120" y="35" fill="#000000" font-size="14" font-weight="bold" text-anchor="middle">Email Service</text>
  </g>

</svg>
