# SafeTrip Spring Boot Configuration (Java 8 / Spring Boot 2.7.18)
server.port=${PORT:8080}

# Database Configuration (MySQL 8)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/safe_trip?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
JWT_SECRET=your_jwt_secret_key_at_least_256_bits_hex
safetrip.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Google Maps Platform Configuration
safetrip.google.maps.api-key=${GOOGLE_MAPS_API_KEY:}
safetrip.google.maps.geocode-url=https://maps.googleapis.com/maps/api/geocode/json
safetrip.google.maps.places-url=https://maps.googleapis.com/maps/api/place

# Groq AI Assistant Configuration
safetrip.groq.api-key=${GROQ_API_KEY:}
safetrip.groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
safetrip.groq.url=${GROQ_URL:https://api.groq.com/openai/v1/chat/completions}

# ===================================================================
# SMTP / Mail Configuration for Password Reset & Emergency Alerts
# ===================================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
safetrip.mail.from=${MAIL_FROM:noreply@safetrip.com}

# Frontend Base URL for Password Reset Links
safetrip.app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Contact Support Email (opens mailto: link in footer)
safetrip.contact.email=${CONTACT_EMAIL:support@safetrip.com}

# CORS Configuration
safetrip.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
